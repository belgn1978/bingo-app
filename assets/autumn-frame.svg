<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760">
<defs>
 <filter id="paper"><feTurbulence baseFrequency=".018" numOctaves="3" seed="12" result="n"/><feBlend in="SourceGraphic" in2="n" mode="soft-light"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation=".65"/></filter>
 <linearGradient id="leaf1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d95f45"/><stop offset="1" stop-color="#f0a24b"/></linearGradient>
 <linearGradient id="leaf2"><stop stop-color="#8d9a67"/><stop offset="1" stop-color="#c3a45f"/></linearGradient>
 <radialGradient id="pump"><stop stop-color="#f4a04e"/><stop offset=".8" stop-color="#cf6a39"/><stop offset="1" stop-color="#a84e31"/></radialGradient>
