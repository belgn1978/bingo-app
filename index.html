<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jo's Bingo Tickets</title>

    <meta
      name="description"
      content="Generate and print custom bingo tickets with various themes"
    />
    <meta name="theme-color" content="#ff69b4" />

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Bingo Card Generator</h1>
    </header>

    <div class="controls-container">
      <div class="control-section">
        <label class="control-label">Bingo Type</label>
        <p class="bingo-type-description">75-Ball Bingo (5×5 with Free Space)</p>
      </div>

      <div class="control-section">
        <label class="control-label">Card Theme (Color)</label>
        <div class="color-options" id="color-select">
          <button
            class="color-btn active"
            data-color="default"
            aria-label="Pink and purple"
            style="
              background: linear-gradient(
                90deg,
                #ff69b4 0%,
                #da70d6 25%,
                #ba55d3 50%,
                #9932cc 75%,
                #8b008b 100%
              );
            "
          ></button>
          <button
            class="color-btn"
            data-color="blue"
            aria-label="Blue and cyan"
            style="background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%)"
          ></button>
          <button
            class="color-btn"
            data-color="purple"
            aria-label="Lavender and pink"
            style="background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%)"
          ></button>
          <button
            class="color-btn"
            data-color="orange"
            aria-label="Pink and yellow"
            style="background: linear-gradient(90deg, #fa709a 0%, #fee140 100%)"
          ></button>
          <button
            class="color-btn"
            data-color="green"
            aria-label="Turquoise and green"
            style="background: linear-gradient(90deg, #30cfd0 0%, #330867 100%)"
          ></button>
          <button
            class="color-btn"
            data-color="sunset"
            aria-label="Sunset colors"
            style="
              background: linear-gradient(
                90deg,
                #ff6b6b 0%,
                #feca57 50%,
                #ee5a6f 100%
              );
            "
          ></button>
          <button
            class="color-btn"
            data-color="ocean"
            aria-label="Ocean colors"
            style="background: linear-gradient(90deg, #2e3192 0%, #1bffff 100%)"
          ></button>
          <button
            class="color-btn"
            data-color="fire"
            aria-label="Fire colors"
            style="background: linear-gradient(90deg, #f12711 0%, #f5af19 100%)"
          ></button>
        </div>
      </div>

      <div class="control-section" id="freeSpaceSection">
        <label class="control-label">Free Space Style</label>
        <div class="free-space-options" id="free-space-options">
          <button
            class="free-space-btn active"
            data-style="text"
            id="free-space-text-style"
          >
            "Free Space" Text
          </button>
          <button class="free-space-btn" data-style="star">⭐ Star</button>
          <button class="free-space-btn" data-style="heart">❤️ Heart</button>
          <button class="free-space-btn" data-style="tree">🎄 Tree</button>
          <button class="free-space-btn" data-style="snowflake">
            ❄️ Snowflake
          </button>
          <button class="free-space-btn" data-style="pumpkin">
            🎃 Pumpkin
          </button>
          <button class="free-space-btn" data-style="ghost">👻 Ghost</button>
          <button class="free-space-btn" data-style="turkey">🦃 Turkey</button>
          <button class="free-space-btn" data-style="gift">🎁 Gift</button>
          <button class="free-space-btn" data-style="firework">
            🎆 Firework
          </button>
          <button class="free-space-btn" data-style="balloon">
            🎈 Balloon
          </button>
          <button class="free-space-btn" data-style="cake">🎂 Cake</button>
          <button class="free-space-btn" data-style="clover">🍀 Clover</button>
          <button class="free-space-btn" data-style="egg">🥚 Egg</button>
          <button class="free-space-btn" data-style="bunny">🐰 Bunny</button>
          <button class="free-space-btn" data-style="flag">🎌 Flag</button>
          <button class="free-space-btn" data-style="menorah">
            🕎 Menorah
          </button>
          <button class="free-space-btn" data-style="dreidel">
            🔯 Dreidel
          </button>
          <button class="free-space-btn" data-style="owl">🦉 Owl</button>
          <button
            class="free-space-btn"
            data-style="custom"
            id="free-space-shape-style"
          >
            ✏️ Custom Text
          </button>
        </div>
        <div id="customTextContainer" style="display: none; margin-top: 1rem">
          <input
            type="text"
            id="custom-text-input"
            class="custom-text-input"
            placeholder="Enter custom text..."
            value="Free Space"
            maxlength="15"
          />
        </div>
      </div>

      <div class="control-section">
        <label class="control-label">Generate Pages</label>
        <div class="page-control">
          <input
            type="number"
            id="num-pages"
            value="1"
            min="1"
            max="10"
            aria-label="Number of pages to generate"
          />
          <span class="info-text">9 unique cards per page, maximum 10 pages</span>
        </div>
      </div>

      <div class="control-section">
        <label class="control-label" for="page-background">Page Background</label>
        <select id="page-background" class="page-background-select">
          <option value="none">No Page Background</option>
          <option value="themed">Color Theme + Free Space Symbol</option>
        </select>
      </div>

      <div class="control-section" id="allowRepeatsSection">
        <div class="checkbox-container">
          <input type="checkbox" id="allow-repeats" checked />
          <label for="allow-repeats">Allow the same number in a column on multiple cards</label>
        </div>
      </div>

      <div class="control-section" style="text-align: center">
        <button
          class="btn btn-primary"
          id="generate-btn"
          style="margin-right: 1rem"
        >
          Generate New Cards
        </button>
        <button class="btn btn-success" id="print-btn">🖨️ Print Cards</button>
      </div>

      <p class="info-text">
        **Note:** For mobile, use **"Add to Home Screen"** for best performance.
      </p>
    </div>

    <div id="bingo-cards-container"></div>

    <script src="./script.js"></script>
  </body>
</html>
