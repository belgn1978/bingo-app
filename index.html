<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bingo Maker">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Bingo Sheet Maker</title>
  <style>
    :root { font-family: Georgia, "Times New Roman", serif; color: #172033; background: #e8eee9; }
    * { box-sizing: border-box; } body { margin: 0; padding: 1rem; }
    header { max-width: 72rem; margin: 0 auto 1rem; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.5rem); } .subtitle { margin: 0; color: #52606d; font: .9rem Arial, sans-serif; }
    .controls { max-width: 72rem; margin: 0 auto 1.5rem; padding: 1rem; background: #fffdf7; border: 1px solid #cbd5d0; border-radius: 8px; box-shadow: 0 8px 24px rgb(23 32 51 / 8%); font-family: Arial, sans-serif; }
    .control-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
    fieldset { min-width: 0; margin: 0; padding: .75rem; border: 1px solid #cbd5d0; border-radius: 5px; } legend { padding: 0 .3rem; font-weight: 700; font-size: .88rem; }
    label { display: block; font-size: .88rem; line-height: 1.35; } select, input[type="text"], input[type="number"] { width: 100%; min-height: 2.5rem; margin-top: .35rem; padding: .45rem .6rem; border: 1px solid #98a8a0; border-radius: 4px; color: #172033; background: #fff; font: inherit; }
    .check { display: flex; align-items: center; gap: .55rem; min-height: 2.5rem; cursor: pointer; } input[type="checkbox"] { width: 1.1rem; height: 1.1rem; accent-color: #0f766e; } .hint { display: block; margin-top: .4rem; color: #61706a; font-size: .75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; } button { min-height: 2.6rem; padding: .55rem .9rem; border: 1px solid #0f5e57; border-radius: 4px; background: #0f766e; color: #fff; cursor: pointer; font: 700 .9rem Arial, sans-serif; } button:hover { background: #0b615a; } button.secondary { background: #fffdf7; color: #0f5e57; } button.secondary:hover { background: #e2f0ea; } button:disabled { cursor: wait; opacity: .65; } #status { margin: .75rem 0 0; color: #52606d; font: .83rem Arial, sans-serif; }
    #sheets { display: grid; gap: 1.5rem; } .sheet { width: min(100%, 210mm); margin: 0 auto; padding: 4rem 2rem; background: #fff; box-shadow: 0 5px 22px rgb(23 32 51 / 16%); } .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; width: 100%; } .card { aspect-ratio: .9; position: relative; }
    .card[class*="theme-"]:not(.theme-classic) { --frame:24px; padding:var(--frame); border:0; border-radius:8px; background:var(--theme-bg); box-shadow:inset 0 0 0 2px var(--theme-edge), inset 0 0 0 5px rgb(255 255 255 / 55%); overflow:visible; }
    .card[class*="theme-"]:not(.theme-classic) .card-head { border-radius:3px 3px 0 0; }
    .card[class*="theme-"]:not(.theme-classic) .cell { background:var(--theme-cell); }
    .card[class*="theme-"]:not(.theme-classic) .free { background:var(--theme-free); color:var(--theme-free-text); }
    .theme-decor { display:none; }
    .card[class*="theme-"]:not(.theme-classic) .theme-decor { display:block; position:absolute; inset:0; z-index:4; pointer-events:none; }
    .theme-decor svg { width:100%; height:100%; overflow:visible; }
    .theme-autumn { --theme-edge:#c99a78; --theme-bg:radial-gradient(circle at 25% 20%,#fff7e8 0 18%,transparent 19%),linear-gradient(145deg,#f7dfbd,#fff6e5 46%,#efd0aa); --theme-cell:#fffaf0; --theme-free:#f4e3c8; --theme-free-text:#74432e; }
    .theme-autumn .card-head { background:transparent !important; gap:2px; padding:0 1px 3px; }
    .theme-autumn .card-head span { border-radius:5px 5px 3px 3px; color:#fffdf8; text-shadow:0 1px 1px rgb(82 51 44 / 35%); box-shadow:inset 0 0 0 1px rgb(100 65 60 / 18%); font-family:Georgia,serif; }
    .theme-autumn .card-head span:nth-child(1){background:#b77ac8}.theme-autumn .card-head span:nth-child(2){background:#e58daf}.theme-autumn .card-head span:nth-child(3){background:#e7a45d}.theme-autumn .card-head span:nth-child(4){background:#76a98c}.theme-autumn .card-head span:nth-child(5){background:#dd7180}
    .theme-autumn .cell { border-color:#d9c8b6; color:#27272a; }
    .theme-autumn::before { content:""; position:absolute; inset:3px; z-index:3; pointer-events:none; border:5px solid transparent; border-image:linear-gradient(90deg,#bd5b38,#d89b39,#70855e,#b54f5e,#d97938) 1; opacity:.38; }
    .theme-autumn .woodland-badge { position:absolute; z-index:5; width:25%; aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 42% 35%,#fff8e9 0 28%,#e7bd8c 30% 58%,#a9633c 60% 100%); border:2px solid #fff0d2; box-shadow:0 1px 4px rgb(88 48 31 / 28%); color:#563522; font:700 8px Georgia,serif; text-align:center; line-height:1; }
    .theme-autumn .woodland-badge.tl { left:1.5%; top:1.5%; } .theme-autumn .woodland-badge.br { right:1.5%; bottom:1.5%; }
    .theme-autumn .woodland-badge svg { width:86%; height:86%; }
    .theme-autumn .botanical-strip { position:absolute; z-index:4; pointer-events:none; left:9%; right:9%; height:10%; display:flex; align-items:center; justify-content:space-around; }
    .theme-autumn .botanical-strip.top { top:1%; } .theme-autumn .botanical-strip.bottom { bottom:1%; transform:rotate(180deg); }
    .theme-autumn .botanical-strip i { width:9%; height:70%; display:block; border-radius:80% 0 80% 0; transform:rotate(var(--r)); background:var(--c); box-shadow:7px 2px 0 -2px #7f925f,14px -1px 0 -3px #b44f5e; }
    .theme-autumn .free { position:relative; border:2px solid #c78355; border-radius:4px; background:radial-gradient(circle at 50% 35%,#fff8e7,#efd2a9); font-family:Georgia,serif; font-weight:800; font-size:clamp(.45rem,1vw,.7rem); color:#70422d; text-transform:uppercase; letter-spacing:.03em; }
    .theme-autumn .free::before { content:"FREE"; display:block; font-size:1.05em; line-height:1; }
    .theme-autumn .free::after { content:"SPACE"; display:block; font-size:.78em; line-height:1.05; }
    .theme-autumn .free.image { font-size:0; }
    .theme-autumn .free.image::before { content:"FREE"; font-size:.65rem; }
    .theme-autumn .free.image::after { content:"SPACE"; font-size:.48rem; }
    .theme-halloween { --theme-edge:#3b2454; --theme-bg:linear-gradient(145deg,#f0a044,#f8dfb4 45%,#6b4b7e); --theme-cell:#fffaf0; --theme-free:#eadff2; --theme-free-text:#3b2454; }
    .theme-christmas { --theme-edge:#8f1d2c; --theme-bg:linear-gradient(145deg,#cfe0d1,#fff8e9 45%,#d9a7a7); --theme-cell:#fffdf8; --theme-free:#dcebdd; --theme-free-text:#20543d; }
    .theme-easter { --theme-edge:#9270aa; --theme-bg:linear-gradient(145deg,#f5d8e7,#fff8e9 45%,#d7e8f5); --theme-cell:#fffdfb; --theme-free:#f5d8e7; --theme-free-text:#72518b; }
    .theme-spring { --theme-edge:#5e8a54; --theme-bg:linear-gradient(145deg,#d9efce,#fff9e8 45%,#d8eaf4); --theme-cell:#fffef9; --theme-free:#e2f1dc; --theme-free-text:#477240; }
    .theme-celebration { --theme-edge:#7550a8; --theme-bg:linear-gradient(145deg,#ffe7a1,#fff7ef 45%,#efc4dc); --theme-cell:#fffdf8; --theme-free:#ffe8a8; --theme-free-text:#68448f; }
    .card { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: auto repeat(5, 1fr); gap: 1px; min-width: 0; overflow: hidden; border: 1px solid var(--edge); background: var(--edge); break-inside: avoid; } .card-head { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); min-height: 2.75rem; padding: .35rem 0; background: var(--head); color: #fff; } .card-head span { display: grid; place-items: center; font-weight: 700; font-size: clamp(.9rem, 2vw, 1.35rem); }
    .cell { display: grid; place-items: center; min-width: 0; padding: .1rem; background: #fff; color: #172033; font: 700 clamp(.72rem, 1.8vw, 1.1rem) Arial, sans-serif; text-align: center; } .free { background: #f2f5ea; color: #0f5e57; font-size: clamp(.58rem, 1.35vw, .85rem); line-height: 1.05; } .free.image { font-size: clamp(1rem, 2.8vw, 1.8rem); }

    @media (max-width: 440px) { .control-grid { grid-template-columns: 1fr; } .actions button { flex: 1 1 100%; } }
    @media print {
      @page { size:A4 portrait; margin:0; }
      html,body { width:210mm; margin:0; padding:0; background:#fff; }
      header,.controls { display:none !important; }
      #sheets { display:block; }
      .sheet { width:210mm; height:297mm; margin:0; padding:8mm; box-shadow:none; break-after:page; page-break-after:always; overflow:hidden; }
      .sheet:last-child { break-after:auto; page-break-after:auto; }
      .cards { height:281mm; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2.5mm; }
      .card { width:auto; height:auto; aspect-ratio:auto; min-height:0; }
      .card[class*="theme-"]:not(.theme-classic) { --frame:5.5mm; border-radius:2mm; }
      .card-head { min-height:10mm; }
      .card-head span { font-size:13pt; }
      .cell { font-size:10pt; padding:0; }
      .free { font-size:6.5pt; }
      .theme-autumn .free.image::before { font-size:6.5pt; }
      .theme-autumn .free.image::after { font-size:5pt; }
      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>
  <header><h1>Bingo Sheet Maker</h1><p class="subtitle">Nine 75-ball cards per A4 page</p></header>
  <main>
    <section class="controls" aria-label="Bingo card settings">
      <div class="control-grid">
        <fieldset><legend>Theme</legend><label for="theme">Ticket design<select id="theme"><option value="classic">Classic</option><option value="autumn">Autumn Woodland</option><option value="halloween">Halloween</option><option value="christmas">Christmas</option><option value="easter">Easter</option><option value="spring">Spring Garden</option><option value="celebration">Birthday / Celebration</option></select></label><span class="hint">Themes decorate the ticket without changing its number rules.</span></fieldset>
        <fieldset><legend>Pages</legend><label for="pages">Number of pages<input id="pages" type="number" min="1" max="500" value="1" inputmode="numeric"></label><span class="hint">1 to 500 pages, 9 cards each</span></fieldset>
        <fieldset><legend>Centre Square</legend><label for="centre-type">Display<select id="centre-type"><option value="text">Text</option><option value="image">Image</option></select></label><label id="text-wrap" for="centre-text">Centre text<input id="centre-text" type="text" maxlength="18" value="FREE SPACE"></label><label id="image-wrap" for="centre-image" hidden>Centre image<select id="centre-image"><optgroup label="Everyday"><option value="star">Star</option><option value="heart">Heart</option><option value="balloon">Balloon</option><option value="clover">Four-leaf clover</option><option value="gift">Gift</option></optgroup><optgroup label="Seasons"><option value="spring">Spring flower</option><option value="summer">Summer sun</option><option value="autumn">Autumn leaf</option><option value="winter">Winter snowflake</option></optgroup><optgroup label="Halloween"><option value="pumpkin">Pumpkin</option><option value="ghost">Ghost</option><option value="bat">Bat</option><option value="witch">Witch</option></optgroup><optgroup label="Christmas"><option value="tree">Christmas tree</option><option value="snowflake">Snowflake</option><option value="snowman">Snowman</option><option value="santa">Santa</option></optgroup><optgroup label="Easter"><option value="bunny">Bunny</option><option value="egg">Easter egg</option><option value="chick">Chick</option><option value="flower">Flower</option></optgroup><optgroup label="Celebration"><option value="cake">Cake</option><option value="fireworks">Fireworks</option><option value="party">Party popper</option></optgroup></select></label></fieldset>
        <fieldset><legend>Header Colour</legend><label for="header-style">Style<select id="header-style"><option value="solid">Standard colour</option><option value="gradient">Linear gradient</option><option value="rainbow">Rainbow</option><option value="different">Different card colours</option></select></label><label for="header-colour">Standard colour<select id="header-colour"><option value="teal">Teal</option><option value="red">Red</option><option value="blue">Blue</option><option value="green">Green</option><option value="orange">Orange</option><option value="purple">Purple</option><option value="pink">Pink</option><option value="yellow">Yellow</option><option value="black">Black</option></select></label><label id="different-finish-wrap" for="different-finish" hidden>Different card finish<select id="different-finish"><option value="solid">Standard colour</option><option value="gradient">Linear gradient</option></select></label></fieldset>
        <fieldset><legend>Number Repeats</legend><label class="check" for="repeats"><input id="repeats" type="checkbox">Allow repeats between cards in a vertical set</label><span class="hint">When off, cards 1/4/7, 2/5/8 and 3/6/9 have no repeated numbers in any B-I-N-G-O column.</span></fieldset>
      </div>
      <div class="actions"><button id="generate" type="button">Generate cards</button><button id="print" type="button" class="secondary">Print / Save as PDF</button></div><p id="status" role="status">Ready.</p>
    </section>
    <section id="sheets" aria-label="Generated bingo sheets"></section>
  </main>
